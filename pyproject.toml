[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-processor"
version = "0.1.0"
description = "Enterprise invoice processing system: PDF/image -> LLM structured extraction -> validation -> PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Engineering" }]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "pymupdf>=1.24.10",
    "pytesseract>=0.3.13",
    "pillow>=10.4",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]

# -----------------------------------------------------------------------------
# Pytest: unit tests run everywhere; integration/e2e require live services.
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast isolated tests (domain + application with fakes)",
    "integration: requires PostgreSQL/Redis (docker compose up)",
    "e2e: full flow tests (offline variant uses fakes, live variant needs compose)",
]
filterwarnings = ["ignore::DeprecationWarning"]

# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "C4",       # comprehensions
    "SIM",      # simplify
    "RUF",
]
ignore = ["E501"]  # line length handled by formatter-friendly code

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
